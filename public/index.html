/* ==========================================================================
   PRATAS MARKET: tema escuro moderno
   Cola isto dentro do <style> (substitui o CSS antigo todo).
   Fontes: o @import já trata disso, podes apagar o <link> do Google Fonts.
   ========================================================================== */
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap");

:root{
  --bg:#07070d; --bg-2:#0d0d17; --card:#11111d; --card-2:#171727;
  --line:#ffffff14; --line-2:#ffffff24;
  --text:#f1f1f8; --mute:#9494ad;
  --violet:#8b5cf6; --indigo:#6366f1; --cyan:#22d3ee; --pink:#ec4899; --green:#34d399;
  --grad:linear-gradient(135deg,#8b5cf6,#6366f1 55%,#22d3ee);
  --grad-soft:linear-gradient(135deg,#8b5cf633,#22d3ee1f);
  --radius:16px;
  --shadow:0 10px 40px -12px #000c;
  --glow:0 0 0 1px #8b5cf655,0 10px 40px -10px #8b5cf688;
  --display:"Space Grotesk","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
}

/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{
  background:
    radial-gradient(900px 500px at 12% -5%,#8b5cf626,transparent 60%),
    radial-gradient(800px 500px at 95% 8%,#22d3ee1a,transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);font:15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased
}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::selection{background:#8b5cf666}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#ffffff1f;border-radius:99px}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.025em;line-height:1.12}

/* ---------- botões e pequenos elementos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:0;font-weight:600;color:#fff;background:var(--grad);box-shadow:0 8px 24px -8px #8b5cf6aa,inset 0 1px 0 #ffffff40;transition:transform .18s,box-shadow .18s,filter .18s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1);box-shadow:0 12px 30px -8px #8b5cf6dd,inset 0 1px 0 #ffffff40}
.btn:active{transform:translateY(0)}
.btn.light,.btn.dark{background:#ffffff0d;border:1px solid var(--line-2);box-shadow:none;backdrop-filter:blur(10px)}
.btn.light:hover,.btn.dark:hover{background:#ffffff1a;box-shadow:none}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.count{min-width:22px;height:22px;border-radius:99px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 11px;border-radius:99px;border:1px solid var(--line-2);background:#ffffff0d;color:#d6d6e8}
.chip.ok{color:var(--green);border-color:#34d3993d;background:#34d3991a}
.chip.hot{color:#fff;background:linear-gradient(135deg,#ec4899,#f43f5e);border-color:transparent}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- cabeçalho ---------- */
.topbar{background:#0d0d17;color:var(--mute);font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;justify-content:center;gap:30px;flex-wrap:wrap}
.topbar b{color:#fff;font-weight:600}
.site-header{position:sticky;top:0;z-index:30;background:#07070dbb;backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;font-family:var(--display);font-weight:700;font-size:21px;flex:none}
.mono{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:20px;background:var(--grad);box-shadow:0 6px 20px -4px #8b5cf6aa,inset 0 1px 0 #fff5}
.search{flex:1;max-width:620px;position:relative;display:block}
.search .icon{position:absolute;left:15px;top:13px;color:var(--mute)}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line-2);background:#ffffff0a;padding:0 54px 0 46px;transition:.2s}
.search input::placeholder{color:#7c7c96}
.search input:focus{outline:0;border-color:#8b5cf6;background:#ffffff10;box-shadow:0 0 0 4px #8b5cf622}
.search kbd{position:absolute;right:14px;top:12px;font:600 12px var(--body);padding:1px 8px;border:1px solid var(--line-2);border-radius:6px;background:#ffffff0d;color:var(--mute)}
.actions{display:flex;gap:10px;margin-left:auto}

/* ---------- hero ---------- */
.hero{margin:32px 0 26px;position:relative}
.slides{display:grid;border-radius:28px;overflow:hidden;border:1px solid var(--line-2);box-shadow:var(--shadow);background:var(--bg-2)}
.slide{grid-area:1/1;display:flex;align-items:center;justify-content:space-between;gap:30px;padding:60px 64px 84px;min-height:360px;opacity:0;pointer-events:none;transition:opacity .6s;color:#fff;
  background:
    radial-gradient(520px 340px at 88% 45%,var(--tone),transparent 70%),
    radial-gradient(600px 300px at 0% 0%,#8b5cf622,transparent 70%),
    linear-gradient(160deg,#12121f,#0a0a13)}
.slide:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(90deg,transparent,#000 60%,transparent);opacity:.6;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .txt{position:relative;max-width:560px;display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.slide h2{font-size:clamp(32px,4.6vw,56px);font-weight:700;background:linear-gradient(180deg,#fff,#b9b9d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.slide p{color:#b4b4cc;font-size:18px;max-width:460px}
.slide .chip{background:#8b5cf624;border-color:#8b5cf666;color:#d8ccff}
.coin{position:relative;flex:none;width:240px;height:240px;border-radius:50%;display:grid;place-items:center;background:var(--grad-soft);border:1px solid var(--line-2);box-shadow:0 0 80px -10px #8b5cf688,inset 0 0 40px #ffffff10;backdrop-filter:blur(6px);animation:float 6s ease-in-out infinite}
.coin:before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed #ffffff26}
.coin span{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:82px;font-weight:700;color:#fff;background:var(--grad);box-shadow:0 20px 50px -10px #6366f1cc,inset 0 2px 0 #fff5}
@keyframes float{50%{transform:translateY(-12px)}}
.hero-ctrl{position:absolute;left:64px;bottom:26px;display:flex;align-items:center;gap:12px;z-index:2}
.hero-ctrl>button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:#ffffff0d;backdrop-filter:blur(8px);color:#fff;font-size:20px;line-height:1;transition:.2s}
.hero-ctrl>button:hover{background:#ffffff22}
#dots{display:flex;gap:7px}
#dots button{width:9px;height:9px;border-radius:50%;border:0;background:#ffffff40;transition:.3s}
#dots button[aria-current=true]{width:30px;border-radius:6px;background:var(--grad)}

/* ---------- vantagens ---------- */
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:52px}
.perk{display:flex;gap:14px;align-items:center;padding:18px 20px;background:linear-gradient(180deg,#ffffff0a,#ffffff04);border:1px solid var(--line);border-radius:var(--radius);transition:.25s}
.perk:hover{border-color:#8b5cf666;transform:translateY(-2px)}
.perk .icon{width:44px;height:44px;padding:11px;border-radius:12px;color:#c4b5fd;background:var(--grad-soft);border:1px solid #8b5cf644;flex:none}
.perk b{display:block;line-height:1.25}.perk span{color:var(--mute);font-size:14px}

/* ---------- catálogo ---------- */
.catalog{display:grid;grid-template-columns:260px 1fr;gap:30px;align-items:start}
.filters{position:sticky;top:100px;background:linear-gradient(180deg,#ffffff0a,#ffffff04);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:22px;backdrop-filter:blur(10px)}
.fh{display:flex;justify-content:space-between;align-items:center}
.fh h2{font-size:20px}
.link{background:none;border:0;color:#a78bfa;font-weight:600;font-size:14px}
.link:hover{color:#c4b5fd}
fieldset{border:0;display:grid;gap:4px}
legend{font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;display:flex;justify-content:space-between;width:100%}
legend b{color:#fff;letter-spacing:0}
.opt{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;font-size:15px;transition:background .15s}
.opt:hover{background:#ffffff0a}
.opt input{accent-color:var(--violet);width:17px;height:17px}
.opt em{margin-left:auto;font-style:normal;color:var(--mute);font-size:12.5px;background:#ffffff0d;padding:0 8px;border-radius:99px}
#pmax{width:100%;accent-color:var(--violet)}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.toolbar h2{font-size:30px;margin-right:auto}
.toolbar #n{color:var(--mute);font-size:14px}
.toolbar select{border:1px solid var(--line-2);border-radius:12px;padding:9px 14px;background:#ffffff0a;font-weight:500;cursor:pointer}
.toolbar select option,.modal select option{background:#14141f;color:#fff}
.toolbar .btn{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--mute)}

/* ---------- cartão de produto ---------- */
.card{position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#171727,#0f0f1a);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);border-color:#8b5cf688;box-shadow:var(--glow)}
.cover{position:relative;height:176px;display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(circle at 70% 20%,color-mix(in srgb,var(--t1) 70%,transparent),transparent 65%),
    linear-gradient(135deg,color-mix(in srgb,var(--t1) 45%,#0b0b14),#0b0b14)}
.cover:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:24px 24px;mask-image:radial-gradient(circle,#000,transparent 75%)}
.cover b{position:relative;z-index:1;font-family:var(--display);font-size:84px;line-height:1;color:#fff;text-shadow:0 0 40px var(--t1),0 4px 20px #0008}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover .plat{position:absolute;z-index:2;left:12px;bottom:12px;font-style:normal;font-size:12px;font-weight:600;color:#fff;background:#000a;backdrop-filter:blur(8px);border:1px solid var(--line-2);border-radius:99px;padding:2px 11px}
.badge{position:absolute;z-index:3;top:12px;left:12px;background:linear-gradient(135deg,#ec4899,#f43f5e);color:#fff;font-weight:700;font-size:13px;padding:2px 10px;border-radius:8px;box-shadow:0 4px 14px -2px #ec4899aa}
.fav{position:absolute;z-index:3;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:#000a;backdrop-filter:blur(8px);display:grid;place-items:center;font-size:16px;line-height:1;transition:.2s}
.fav:hover{transform:scale(1.1)}
.fav[aria-pressed=true]{background:#ec4899;border-color:#ec4899;color:#fff}
.card-body{display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;flex:1}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a78bfa}
.card h3{font-size:20px}
.card p{font-size:14.5px;color:var(--mute);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price-row{display:flex;align-items:center;gap:9px;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
.price{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.old{color:#6e6e88;text-decoration:line-through;font-size:14px}
.price-row .btn{margin-left:auto}

/* ---------- faq e rodapé ---------- */
.faq{max-width:780px;margin:90px auto 0}
.faq h2{font-size:34px;margin-bottom:20px;text-align:center}
details{background:#ffffff08;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:10px;transition:.2s}
details[open]{border-color:#8b5cf655;background:#8b5cf60d}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:22px;line-height:1;color:#a78bfa}
details[open] summary:after{content:"−"}
details p{margin-top:10px;color:var(--mute)}
.site-footer{margin-top:100px;background:linear-gradient(180deg,transparent,#0b0b15);color:var(--mute);padding:50px 0 30px;border-top:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}
.site-footer h3{color:#fff;font-size:18px;margin-bottom:12px}
.site-footer ul{list-style:none;display:grid;gap:8px}
.site-footer a{transition:.15s}.site-footer a:hover{color:#c4b5fd}
.copy{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);font-size:14px}

/* ---------- carrinho, modais, avisos ---------- */
.overlay{position:fixed;inset:0;background:#05050bcc;backdrop-filter:blur(6px);z-index:50;display:none}
.overlay.open{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:51;background:#0d0d17;border-left:1px solid var(--line-2);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 60px -20px #000}
.drawer.open{transform:none}
.mh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.mh h3{font-size:21px}
.close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:#ffffff0d;color:#fff;font-size:22px;line-height:1;transition:.2s}
.close:hover{background:#ffffff1f;transform:rotate(90deg)}
.drawer-body{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:10px;background:#ffffff08;border:1px solid var(--line);border-radius:14px}
.item .cover{height:60px;width:60px;border-radius:10px}.item .cover b{font-size:30px}.item .cover:before{display:none}
.item b.n{display:block;line-height:1.25}.item small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:600}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line-2);background:#ffffff0d;line-height:1}
.qty button:hover{background:#8b5cf644}
.drawer-foot{padding:20px 22px;border-top:1px solid var(--line);background:#0a0a12}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:14px}
.drawer-foot .btn{width:100%}
.modal{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;background:#0f0f1b;border:1px solid var(--line-2);border-radius:24px;box-shadow:0 40px 100px -20px #000,0 0 80px -30px #8b5cf6;display:none}
.modal.open{display:block;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%) scale(.97)}}
.modal.wide{width:min(800px,calc(100vw - 28px))}
.modal form{padding:6px 24px 24px}
.modal label{display:block;font-size:13px;font-weight:600;color:#c9c9de;margin:14px 0 6px}
.modal input,.modal textarea,.modal select{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line-2);background:#ffffff0a;transition:.2s}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:0;border-color:#8b5cf6;box-shadow:0 0 0 4px #8b5cf622}
.modal textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal form .btn{width:100%;margin-top:20px}
#hp{position:absolute;left:-9999px}
#msg{font-size:14px;font-weight:600;color:#fb7185;margin-top:12px;min-height:20px}
.done{display:none;padding:42px 26px;text-align:center}
.done .tick{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:28px;color:#fff;background:linear-gradient(135deg,#10b981,#22d3ee);box-shadow:0 0 40px -6px #34d399}
.done p{color:var(--mute);margin:10px 0 20px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:26px}
.detail .cover{height:100%;min-height:280px;border:1px solid var(--line);border-radius:18px}
.info{display:flex;flex-direction:column;gap:14px}.info p{color:var(--mute)}
.info ul{list-style:none;display:grid;gap:9px}
.info li{display:flex;gap:10px;font-size:15px}
.info li:before{content:"✓";flex:none;width:20px;height:20px;margin-top:2px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--grad)}
.info .price-row{margin-top:auto}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1}
.toast{position:fixed;left:50%;bottom:26px;z-index:70;transform:translate(-50%,100px);background:#1a1a2ee6;backdrop-filter:blur(14px);border:1px solid #8b5cf666;color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;box-shadow:var(--glow);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.toast.on{transform:translate(-50%,0)}

/* ---------- responsivo e acessibilidade ---------- */
@media (max-width:960px){
  .catalog{grid-template-columns:1fr}
  .filters{display:none;position:static}.filters.open{display:flex}
  .toolbar .btn{display:inline-flex}
}
@media (max-width:860px){
  .bar{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}
  .actions .t{display:none}
  .slide{padding:38px 26px 76px}.coin{display:none}.hero-ctrl{left:26px}
  .perks,.fgrid,.detail{grid-template-columns:1fr}
  .detail .cover{min-height:190px}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
